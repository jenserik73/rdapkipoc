<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueryChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0e0f11;
    --bg2: #161719;
    --bg3: #1e1f23;
    --bg4: #26272d;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e9ec;
    --text2: #9a9ba3;
    --text3: #5a5b63;
    --accent: #5b7fff;
    --accent2: #3d5ce8;
    --green: #3ecf8e;
    --amber: #f0a22a;
    --red: #f06060;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }

  /* Layout */
  #app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; overflow: hidden; }

  /* Sidebar */
  #sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  #sidebar-header .logo {
    font-family: var(--mono); font-size: 15px; font-weight: 600;
    color: var(--accent); letter-spacing: -0.5px;
  }
  #sidebar-header .logo span { color: var(--text2); }
  #new-chat-btn {
    margin: 12px; padding: 9px 14px;
    background: rgba(91,127,255,0.12); border: 1px solid rgba(91,127,255,0.25);
    border-radius: 8px; color: var(--accent); font-family: var(--sans); font-size: 13px;
    cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.15s;
  }
  #new-chat-btn:hover { background: rgba(91,127,255,0.2); }
  #new-chat-btn svg { flex-shrink: 0; }
  #history-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  #history-list::-webkit-scrollbar { width: 4px; }
  #history-list::-webkit-scrollbar-track { background: transparent; }
  #history-list::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
  .history-item {
    padding: 9px 10px; border-radius: 7px; cursor: pointer;
    color: var(--text2); font-size: 12.5px; line-height: 1.4;
    transition: all 0.12s; border: 1px solid transparent; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .history-item:hover { background: var(--bg3); color: var(--text); }
  .history-item.active { background: var(--bg3); color: var(--text); border-color: var(--border); }
  .history-section-label {
    font-size: 10.5px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em;
    padding: 12px 10px 5px;
  }
  #sidebar-footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text3); display: flex; align-items: center; gap: 8px;
  }
  .env-badge {
    font-family: var(--mono); font-size: 10px; background: var(--bg4);
    border: 1px solid var(--border); padding: 2px 7px; border-radius: 4px; color: var(--text2);
  }

  /* Main */
  #main { display: flex; flex-direction: column; overflow: hidden; }
  #chat-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #chat-header .title { font-size: 14px; font-weight: 500; color: var(--text); }
  #chat-header .meta { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px rgba(62,207,142,0.5); flex-shrink: 0;
  }
  .status-dot.disconnected { background: var(--text3); box-shadow: none; }

  /* Messages */
  #messages {
    flex: 1; overflow-y: auto; padding: 24px 0;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
  .msg-wrapper { padding: 0 24px 2px; max-width: 900px; margin: 0 auto; width: 100%; }
  .msg-wrapper + .msg-wrapper { margin-top: 4px; }
  .msg {
    display: flex; gap: 12px; padding: 12px 14px;
    border-radius: 10px; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { background: rgba(91,127,255,0.08); border: 1px solid rgba(91,127,255,0.12); }
  .msg.assistant { background: var(--bg2); border: 1px solid var(--border); }
  .msg.error { background: rgba(240,96,96,0.07); border: 1px solid rgba(240,96,96,0.2); }
  .avatar {
    width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    font-family: var(--mono);
  }
  .avatar.user { background: rgba(91,127,255,0.2); color: var(--accent); }
  .avatar.ai { background: rgba(62,207,142,0.15); color: var(--green); font-size: 10px; }
  .msg-body { flex: 1; min-width: 0; }
  .msg-meta { font-size: 11px; color: var(--text3); margin-bottom: 5px; }
  .msg-text { color: var(--text2); line-height: 1.65; font-size: 13.5px; }
  .msg.user .msg-text { color: var(--text); }
  .msg-text p + p { margin-top: 8px; }

  /* SQL block */
  .sql-block {
    margin-top: 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .sql-block-header {
    padding: 7px 12px; background: var(--bg3); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sql-block-header span { font-family: var(--mono); font-size: 10.5px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
  .copy-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 11px; font-family: var(--sans); padding: 2px 6px; border-radius: 4px; transition: all 0.12s; }
  .copy-btn:hover { color: var(--text); background: var(--bg4); }
  .sql-block pre { padding: 12px; font-family: var(--mono); font-size: 12px; color: #9ab0d8; line-height: 1.6; overflow-x: auto; }
  .sql-keyword { color: #5b7fff; }
  .sql-string { color: #f0a22a; }
  .sql-num { color: #3ecf8e; }

  /* Result views */
  .result-container { margin-top: 12px; }
  .result-tabs {
    display: flex; gap: 2px; margin-bottom: 10px;
    border-bottom: 1px solid var(--border); padding-bottom: 0;
  }
  .rtab {
    padding: 6px 12px; font-size: 12px; cursor: pointer; border: none; background: none;
    color: var(--text3); font-family: var(--sans); border-radius: 6px 6px 0 0;
    transition: all 0.12s; position: relative; bottom: -1px;
    border: 1px solid transparent; border-bottom: none;
  }
  .rtab:hover { color: var(--text2); }
  .rtab.active { color: var(--accent); background: var(--bg2); border-color: var(--border); }
  .result-panel { display: none; }
  .result-panel.active { display: block; }

  /* Table result */
  .result-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
  .result-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  .result-table th {
    background: var(--bg3); color: var(--text2); font-weight: 500;
    padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border);
    white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .result-table td {
    padding: 7px 12px; color: var(--text); border-bottom: 1px solid var(--border);
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .result-table tr:last-child td { border-bottom: none; }
  .result-table tr:hover td { background: rgba(255,255,255,0.02); }
  .result-table td.num { color: var(--green); }
  .result-count { font-size: 11.5px; color: var(--text3); margin-top: 7px; font-family: var(--mono); }

  /* Chart */
  .chart-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .chart-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .chart-control-btn {
    padding: 4px 10px; font-size: 11.5px; cursor: pointer; font-family: var(--sans);
    background: var(--bg3); border: 1px solid var(--border); color: var(--text2); border-radius: 5px; transition: all 0.12s;
  }
  .chart-control-btn:hover { color: var(--text); }
  .chart-control-btn.active { background: rgba(91,127,255,0.15); border-color: rgba(91,127,255,0.3); color: var(--accent); }
  .chart-canvas-wrap { position: relative; height: 260px; }

  /* Text result */
  .text-result { color: var(--text2); line-height: 1.75; font-size: 13.5px; }
  .text-result strong { color: var(--text); font-weight: 500; }

  /* Feedback */
  .feedback-row {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
    padding-top: 10px; border-top: 1px solid var(--border);
  }
  .feedback-label { font-size: 11.5px; color: var(--text3); }
  .fb-btn {
    padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: var(--sans);
    background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
    border-radius: 5px; transition: all 0.12s; display: flex; align-items: center; gap: 5px;
  }
  .fb-btn:hover { border-color: var(--border2); color: var(--text); }
  .fb-btn.positive.active { background: rgba(62,207,142,0.1); border-color: rgba(62,207,142,0.3); color: var(--green); }
  .fb-btn.negative.active { background: rgba(240,96,96,0.1); border-color: rgba(240,96,96,0.3); color: var(--red); }
  .fb-comment { display: none; margin-top: 8px; }
  .fb-comment.show { display: flex; gap: 8px; }
  .fb-comment input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    font-family: var(--sans); font-size: 12.5px; padding: 6px 10px; border-radius: 6px; outline: none;
    transition: border-color 0.12s;
  }
  .fb-comment input:focus { border-color: var(--border2); }
  .fb-comment input::placeholder { color: var(--text3); }
  .fb-send {
    padding: 6px 12px; background: rgba(91,127,255,0.15); border: 1px solid rgba(91,127,255,0.25);
    color: var(--accent); font-family: var(--sans); font-size: 12px; border-radius: 6px; cursor: pointer; transition: all 0.12s;
  }
  .fb-send:hover { background: rgba(91,127,255,0.25); }

  /* Empty state */
  #empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px; text-align: center; gap: 16px;
  }
  #empty-state .ql { font-family: var(--mono); font-size: 38px; color: var(--bg4); line-height: 1; }
  #empty-state h2 { font-size: 18px; font-weight: 500; color: var(--text); }
  #empty-state p { color: var(--text2); font-size: 13.5px; max-width: 380px; line-height: 1.65; }
  .example-queries { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .example-q {
    padding: 9px 14px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text2); font-size: 13px; cursor: pointer;
    transition: all 0.12s; text-align: left; font-family: var(--sans);
  }
  .example-q:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }

  /* Input area */
  #input-area {
    padding: 16px 24px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  #input-wrap {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; transition: border-color 0.15s;
  }
  #input-wrap:focus-within { border-color: rgba(91,127,255,0.35); }
  #query-input {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5;
    min-height: 22px; max-height: 180px; overflow-y: auto; padding: 0;
  }
  #query-input::placeholder { color: var(--text3); }
  #query-input::-webkit-scrollbar { width: 3px; }
  #query-input::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
  #send-btn {
    width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  #send-btn:hover { background: var(--accent2); }
  #send-btn:disabled { background: var(--bg4); cursor: not-allowed; }
  #send-btn svg { color: white; }
  .input-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 7px; padding: 0 2px;
  }
  .input-hint { font-size: 11px; color: var(--text3); }
  .input-hint kbd {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 5px; font-family: var(--mono); font-size: 10px;
  }

  /* Loading indicator */
  .thinking {
    display: flex; gap: 5px; align-items: center; padding: 4px 0;
  }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Config modal */
  #config-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    z-index: 100; align-items: center; justify-content: center;
  }
  #config-modal.show { display: flex; }
  .modal-box {
    background: var(--bg2); border: 1px solid var(--border2); border-radius: 14px;
    padding: 24px; width: 440px; max-width: 95vw;
  }
  .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 20px; color: var(--text); }
  .field-group { margin-bottom: 16px; }
  .field-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  .field-group input, .field-group select {
    width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    font-family: var(--sans); font-size: 13px; padding: 8px 10px; border-radius: 7px; outline: none;
    transition: border-color 0.12s;
  }
  .field-group input:focus, .field-group select:focus { border-color: rgba(91,127,255,0.4); }
  .field-group input::placeholder { color: var(--text3); }
  .field-group select option { background: var(--bg3); }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; justify-content: flex-end; }
  .btn-cancel { padding: 8px 16px; background: none; border: 1px solid var(--border); color: var(--text2); font-family: var(--sans); font-size: 13px; border-radius: 7px; cursor: pointer; transition: all 0.12s; }
  .btn-cancel:hover { color: var(--text); border-color: var(--border2); }
  .btn-save { padding: 8px 16px; background: var(--accent); border: none; color: white; font-family: var(--sans); font-size: 13px; border-radius: 7px; cursor: pointer; font-weight: 500; transition: all 0.12s; }
  .btn-save:hover { background: var(--accent2); }

  /* Topbar icons */
  .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: var(--text3); transition: all 0.12s; display: flex; align-items: center; }
  .icon-btn:hover { color: var(--text); background: var(--bg3); }

  /* scrollbar for messages area */
  #messages-inner { max-width: 900px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--accent)">
        <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v5c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 10v5c0 1.66 4.03 3 9 3s9-1.34 9-3v-5"/>
      </svg>
      <div class="logo">query<span>chat</span></div>
    </div>
    <button id="new-chat-btn" onclick="newChat()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Ny samtale
    </button>
    <div id="history-list"></div>
    <div id="sidebar-footer">
      <div class="status-dot" id="status-dot"></div>
      <span class="env-badge" id="env-label">eu-frankfurt-2</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="endpoint-label">ikke konfigurert</span>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="chat-header">
      <div>
        <div class="title" id="chat-title">Ny samtale</div>
        <div class="meta" id="chat-meta">sql-executor · API Gateway</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="icon-btn" title="Innstillinger" onclick="openConfig()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" title="Eksporter historikk" onclick="exportHistory()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
    </div>

    <div id="messages">
      <div id="messages-inner">
        <div id="empty-state">
          <div class="ql">⟩_</div>
          <h2>QueryChat</h2>
          <p>Still spørsmål til databasen på naturlig norsk eller engelsk. Resultatene vises som tabell, tekst eller graf.</p>
          <div class="example-queries">
            <button class="example-q" onclick="useExample(this)">Vis de 10 siste meldingene fra loggene</button>
            <button class="example-q" onclick="useExample(this)">Hva er gjennomsnittlig responstid per tjeneste siste uke?</button>
            <button class="example-q" onclick="useExample(this)">Tell antall feil per dag de siste 30 dagene</button>
            <button class="example-q" onclick="useExample(this)">Vis alle tabeller i databasen</button>
          </div>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-wrap">
        <textarea id="query-input" placeholder="Spør om dataene dine..." rows="1"></textarea>
        <button id="send-btn" onclick="sendQuery()" title="Send (Enter)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="input-hint"><kbd>Enter</kbd> sender · <kbd>Shift+Enter</kbd> ny linje</span>
        <span class="input-hint" id="char-count"></span>
      </div>
    </div>
  </div>
</div>

<!-- Config modal -->
<div id="config-modal">
  <div class="modal-box">
    <div class="modal-title">Konfigurasjon</div>
    <div class="field-group">
      <label>API Gateway URL</label>
      <input type="text" id="cfg-url" placeholder="https://api.your-domain.com/v1/ask" />
    </div>
    <div class="field-group">
      <label>API Nøkkel (valgfritt)</label>
      <input type="password" id="cfg-key" placeholder="Bearer token eller API-nøkkel" />
    </div>
    <div class="field-group">
      <label>Feedback endpoint</label>
      <input type="text" id="cfg-fb" placeholder="https://api.your-domain.com/v1/feedback" />
    </div>
    <div class="field-group">
      <label>Miljø</label>
      <select id="cfg-env">
        <option value="eu-frankfurt-2">OCI EU Sovereign Cloud (eu-frankfurt-2)</option>
        <option value="eu-frankfurt-1">OCI Frankfurt (eu-frankfurt-1)</option>
        <option value="custom">Tilpasset</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeConfig()">Avbryt</button>
      <button class="btn-save" onclick="saveConfig()">Lagre</button>
    </div>
  </div>
</div>

<script>
// --- Config ---
let config = {
  url: localStorage.getItem('qc_url') || '',
  key: localStorage.getItem('qc_key') || '',
  fbUrl: localStorage.getItem('qc_fb') || '',
  env: localStorage.getItem('qc_env') || 'eu-frankfurt-2'
};

// --- State ---
let sessions = JSON.parse(localStorage.getItem('qc_sessions') || '[]');
let currentSession = null;
let isLoading = false;
let chartInstances = {};
let messageCounter = 0;

// --- Init ---
function init() {
  updateEndpointLabel();
  renderHistory();
  if (sessions.length > 0) loadSession(sessions[0].id);
  setupInput();
}

function updateEndpointLabel() {
  const el = document.getElementById('endpoint-label');
  const dot = document.getElementById('status-dot');
  const envEl = document.getElementById('env-label');
  if (config.url) {
    try {
      const u = new URL(config.url);
      el.textContent = u.hostname;
      dot.className = 'status-dot';
      envEl.textContent = config.env;
    } catch {
      el.textContent = config.url.substring(0,30);
    }
  } else {
    el.textContent = 'ikke konfigurert';
    dot.className = 'status-dot disconnected';
  }
}

// --- Input ---
function setupInput() {
  const ta = document.getElementById('query-input');
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 180) + 'px';
    const len = ta.value.length;
    document.getElementById('char-count').textContent = len > 50 ? len + ' tegn' : '';
  });
}

function useExample(btn) {
  document.getElementById('query-input').value = btn.textContent;
  document.getElementById('empty-state').style.display = 'none';
  sendQuery();
}

// --- Sessions ---
function newChat() {
  const s = { id: Date.now(), title: 'Ny samtale', messages: [], created: new Date().toISOString() };
  sessions.unshift(s);
  saveSessions();
  loadSession(s.id);
}

function loadSession(id) {
  currentSession = sessions.find(s => s.id === id);
  if (!currentSession) return;
  renderMessages();
  renderHistory();
  document.getElementById('chat-title').textContent = currentSession.title;
}

function saveSessions() {
  localStorage.setItem('qc_sessions', JSON.stringify(sessions.slice(0, 50)));
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!sessions.length) { el.innerHTML = '<div class="history-section-label">Ingen historikk</div>'; return; }
  const today = [], older = [];
  const now = new Date();
  sessions.forEach(s => {
    const d = new Date(s.created);
    const diffDays = (now - d) / 86400000;
    if (diffDays < 1) today.push(s); else older.push(s);
  });
  let html = '';
  if (today.length) { html += '<div class="history-section-label">I dag</div>'; today.forEach(s => { html += historyItem(s); }); }
  if (older.length) { html += '<div class="history-section-label">Tidligere</div>'; older.forEach(s => { html += historyItem(s); }); }
  el.innerHTML = html;
  el.querySelectorAll('.history-item').forEach(item => {
    item.addEventListener('click', () => loadSession(+item.dataset.id));
  });
}

function historyItem(s) {
  const active = currentSession && currentSession.id === s.id ? ' active' : '';
  return `<div class="history-item${active}" data-id="${s.id}">${escHtml(s.title)}</div>`;
}

// --- Send ---
async function sendQuery() {
  const ta = document.getElementById('query-input');
  const q = ta.value.trim();
  if (!q || isLoading) return;
  ta.value = ''; ta.style.height = 'auto';
  document.getElementById('char-count').textContent = '';

  if (!currentSession) newChat();
  if (currentSession.messages.length === 0) {
    currentSession.title = q.length > 48 ? q.substring(0,48)+'…' : q;
    document.getElementById('chat-title').textContent = currentSession.title;
  }
  document.getElementById('empty-state').style.display = 'none';

  const userMsg = { id: ++messageCounter, role: 'user', text: q, ts: new Date().toISOString() };
  currentSession.messages.push(userMsg);
  appendUserMessage(userMsg);
  saveSessions();
  renderHistory();

  const thinkId = ++messageCounter;
  appendThinking(thinkId);
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  let result;
  if (!config.url) {
    result = { type: 'mock', data: mockResponse(q) };
  } else {
    result = await callApi(q, currentSession.messages);
  }

  removeThinking(thinkId);
  isLoading = false;
  document.getElementById('send-btn').disabled = false;

  const aiMsg = {
    id: ++messageCounter,
    role: 'assistant',
    text: result.data.text || '',
    sql: result.data.sql || null,
    rows: result.data.rows || null,
    columns: result.data.columns || null,
    error: result.data.error || null,
    ts: new Date().toISOString()
  };
  currentSession.messages.push(aiMsg);
  saveSessions();
  appendAssistantMessage(aiMsg);
  scrollToBottom();
}

async function callApi(question, history) {
  const headers = { 'Content-Type': 'application/json' };
  if (config.key) headers['Authorization'] = config.key.startsWith('Bearer ') ? config.key : 'Bearer ' + config.key;
  const body = { question, history: history.slice(-10).map(m => ({ role: m.role, content: m.text })) };
  try {
    const res = await fetch(config.url, { method: 'POST', headers, body: JSON.stringify(body) });
    if (!res.ok) {
      const err = await res.text();
      return { type: 'error', data: { error: `HTTP ${res.status}: ${err.substring(0,200)}` } };
    }
    const json = await res.json();
    return { type: 'ok', data: normalizeResponse(json) };
  } catch (e) {
    return { type: 'error', data: { error: 'Kunne ikke nå API: ' + e.message } };
  }
}

function normalizeResponse(json) {
  // Handles both {text, sql, rows, columns} and {answer, query, data} shapes
  return {
    text: json.text || json.answer || json.response || json.message || '',
    sql: json.sql || json.query || json.generated_sql || null,
    rows: json.rows || json.data || json.results || null,
    columns: json.columns || json.fields || (json.rows && json.rows[0] ? Object.keys(json.rows[0]) : null) || null,
    error: json.error || null
  };
}

// --- Mock ---
function mockResponse(q) {
  const ql = q.toLowerCase();
  if (ql.includes('logg') || ql.includes('log') || ql.includes('siste')) {
    return {
      text: 'Her er de 10 siste hendelsene fra loggtabellen:',
      sql: 'SELECT id, service, level, message, created_at\nFROM logs\nORDER BY created_at DESC\nFETCH FIRST 10 ROWS ONLY',
      columns: ['id','service','level','message','created_at'],
      rows: [
        {id:1042,service:'sql-executor',level:'INFO',message:'Query executed in 42ms',created_at:'2026-06-08 09:41:22'},
        {id:1041,service:'api-gateway',level:'INFO',message:'Route /v1/ask matched',created_at:'2026-06-08 09:41:21'},
        {id:1040,service:'sql-executor',level:'WARN',message:'Slow query detected (>200ms)',created_at:'2026-06-08 09:38:05'},
        {id:1039,service:'vault',level:'INFO',message:'Secret retrieved successfully',created_at:'2026-06-08 09:35:12'},
        {id:1038,service:'sql-executor',level:'ERROR',message:'Connection timeout on retry 1',created_at:'2026-06-08 09:30:01'},
        {id:1037,service:'api-gateway',level:'INFO',message:'Health check OK',created_at:'2026-06-08 09:25:00'},
        {id:1036,service:'sql-executor',level:'INFO',message:'Query executed in 18ms',created_at:'2026-06-08 09:20:44'},
        {id:1035,service:'api-gateway',level:'INFO',message:'Rate limit: 3/100 req/min',created_at:'2026-06-08 09:15:30'},
        {id:1034,service:'sql-executor',level:'INFO',message:'Wallet loaded from /tmp/wallet',created_at:'2026-06-08 09:10:05'},
        {id:1033,service:'api-gateway',level:'INFO',message:'TLS certificate valid',created_at:'2026-06-08 09:05:00'},
      ]
    };
  }
  if (ql.includes('responstid') || ql.includes('response') || ql.includes('tjeneste')) {
    return {
      text: 'Gjennomsnittlig responstid per tjeneste de siste 7 dagene:',
      sql: "SELECT service, ROUND(AVG(duration_ms),1) AS avg_ms,\n       MIN(duration_ms) AS min_ms, MAX(duration_ms) AS max_ms\nFROM request_log\nWHERE created_at >= SYSDATE - 7\nGROUP BY service\nORDER BY avg_ms DESC",
      columns: ['service','avg_ms','min_ms','max_ms'],
      rows: [
        {service:'sql-executor',avg_ms:87.4,min_ms:11,max_ms:412},
        {service:'api-gateway',avg_ms:12.1,min_ms:4,max_ms:38},
        {service:'vault',avg_ms:9.8,min_ms:5,max_ms:24},
        {service:'oke-ingress',avg_ms:5.2,min_ms:2,max_ms:15},
      ]
    };
  }
  if (ql.includes('feil') || ql.includes('error') || ql.includes('dag')) {
    return {
      text: 'Antall feil per dag de siste 30 dagene — notat: spike 2. juni trolig relatert til ADB-tilkoblingsproblem.',
      sql: "SELECT TRUNC(created_at) AS day,\n       COUNT(*) AS errors\nFROM logs\nWHERE level = 'ERROR'\n  AND created_at >= SYSDATE - 30\nGROUP BY TRUNC(created_at)\nORDER BY day",
      columns: ['day','errors'],
      rows: Array.from({length:12}, (_,i) => {
        const d = new Date('2026-06-08'); d.setDate(d.getDate()-11+i);
        return { day: d.toISOString().slice(0,10), errors: [0,1,0,2,0,1,0,0,3,8,1,0][i] };
      })
    };
  }
  if (ql.includes('tabell') || ql.includes('table')) {
    return {
      text: 'Følgende tabeller ble funnet i skjemaet:',
      sql: "SELECT table_name, num_rows, last_analyzed\nFROM user_tables\nORDER BY table_name",
      columns: ['table_name','num_rows','last_analyzed'],
      rows: [
        {table_name:'FEEDBACK',num_rows:248,last_analyzed:'2026-06-07'},
        {table_name:'LOGS',num_rows:104821,last_analyzed:'2026-06-08'},
        {table_name:'MESSAGES',num_rows:1337,last_analyzed:'2026-06-07'},
        {table_name:'REQUEST_LOG',num_rows:44201,last_analyzed:'2026-06-08'},
        {table_name:'SESSIONS',num_rows:892,last_analyzed:'2026-06-07'},
      ]
    };
  }
  return {
    text: 'Spørringen ble behandlet. Ingen API-URL er konfigurert — dette er demo-data. Konfigurer endepunktet via tannhjulet øverst til høyre.',
    sql: 'SELECT * FROM demo_table WHERE 1=1',
    columns: ['kolonne_1','kolonne_2'],
    rows: [{kolonne_1:'demo',kolonne_2:'data'}]
  };
}

// --- Render messages ---
function renderMessages() {
  const el = document.getElementById('messages-inner');
  el.innerHTML = '';
  const es = document.createElement('div');
  es.id = 'empty-state';
  es.style.display = currentSession && currentSession.messages.length ? 'none' : '';
  es.innerHTML = `<div class="ql">⟩_</div><h2>QueryChat</h2><p>Still spørsmål til databasen på naturlig norsk eller engelsk.</p>`;
  el.appendChild(es);
  if (currentSession) {
    currentSession.messages.forEach(m => {
      if (m.role === 'user') appendUserMessage(m, false);
      else appendAssistantMessage(m, false);
    });
  }
  scrollToBottom();
}

function appendUserMessage(msg, animate=true) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrapper'; wrap.dataset.msgId = msg.id;
  wrap.innerHTML = `<div class="msg user ${animate?'':''}">
    <div class="avatar user">U</div>
    <div class="msg-body">
      <div class="msg-meta">${fmtTime(msg.ts)}</div>
      <div class="msg-text">${escHtml(msg.text)}</div>
    </div>
  </div>`;
  document.getElementById('messages-inner').appendChild(wrap);
  if (animate) scrollToBottom();
}

function appendThinking(id) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrapper'; wrap.dataset.thinkId = id;
  wrap.innerHTML = `<div class="msg assistant">
    <div class="avatar ai">AI</div>
    <div class="msg-body">
      <div class="thinking"><span></span><span></span><span></span></div>
    </div>
  </div>`;
  document.getElementById('messages-inner').appendChild(wrap);
  scrollToBottom();
}

function removeThinking(id) {
  const el = document.querySelector(`[data-think-id="${id}"]`);
  if (el) el.remove();
}

function appendAssistantMessage(msg, animate=true) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrapper'; wrap.dataset.msgId = msg.id;

  let inner = '';
  if (msg.error) {
    inner = `<div class="msg error">
      <div class="avatar ai">AI</div>
      <div class="msg-body">
        <div class="msg-meta">${fmtTime(msg.ts)}</div>
        <div class="msg-text" style="color:var(--red)">${escHtml(msg.error)}</div>
      </div>
    </div>`;
  } else {
    const mid = 'msg_' + msg.id;
    let sqlBlock = '';
    if (msg.sql) {
      sqlBlock = `<div class="sql-block">
        <div class="sql-block-header">
          <span>SQL</span>
          <button class="copy-btn" onclick="copySql(this,'${escAttr(msg.sql)}')">kopier</button>
        </div>
        <pre>${highlightSql(escHtml(msg.sql))}</pre>
      </div>`;
    }
    let resultBlock = '';
    if (msg.rows && msg.rows.length > 0 && msg.columns) {
      resultBlock = buildResultBlock(mid, msg.columns, msg.rows);
    }
    inner = `<div class="msg assistant">
      <div class="avatar ai">AI</div>
      <div class="msg-body">
        <div class="msg-meta">${fmtTime(msg.ts)}</div>
        <div class="msg-text text-result">${formatText(msg.text)}</div>
        ${sqlBlock}
        ${resultBlock}
        <div class="feedback-row">
          <span class="feedback-label">Var dette nyttig?</span>
          <button class="fb-btn positive" onclick="feedback(this,'positive','${mid}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
            Ja
          </button>
          <button class="fb-btn negative" onclick="feedback(this,'negative','${mid}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>
            Nei
          </button>
          <div class="fb-comment" id="fbc_${mid}">
            <input type="text" placeholder="Legg til kommentar (valgfritt)…" id="fbinput_${mid}" />
            <button class="fb-send" onclick="sendFeedback('${mid}')">Send</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  wrap.innerHTML = inner;
  document.getElementById('messages-inner').appendChild(wrap);
  if (animate) scrollToBottom();
  // Init chart after DOM insert
  if (msg.rows && msg.columns) {
    const mid = 'msg_' + msg.id;
    initChart(mid, msg.columns, msg.rows);
  }
}

function buildResultBlock(mid, columns, rows) {
  const hasNumeric = columns.some(c => typeof rows[0][c] === 'number');
  const tabs = `<div class="result-tabs">
    <button class="rtab active" onclick="switchTab('${mid}','table',this)">Tabell</button>
    <button class="rtab" onclick="switchTab('${mid}','text',this)">Tekst</button>
    ${hasNumeric ? `<button class="rtab" onclick="switchTab('${mid}','chart',this)">Graf</button>` : ''}
  </div>`;

  const tableHtml = buildTable(columns, rows);
  const textHtml = buildTextView(columns, rows);
  const chartHtml = hasNumeric ? `<div class="chart-wrap">
    <div class="chart-controls" id="chart-ctrl-${mid}">
      <button class="chart-control-btn active" onclick="setChartType('${mid}','bar',this)">Søyle</button>
      <button class="chart-control-btn" onclick="setChartType('${mid}','line',this)">Linje</button>
      <button class="chart-control-btn" onclick="setChartType('${mid}','pie',this)">Kake</button>
    </div>
    <div class="chart-canvas-wrap"><canvas id="chart_${mid}"></canvas></div>
  </div>` : '';

  return `<div class="result-container">
    ${tabs}
    <div class="result-panel active" id="panel_table_${mid}">${tableHtml}</div>
    <div class="result-panel" id="panel_text_${mid}">${textHtml}</div>
    ${hasNumeric ? `<div class="result-panel" id="panel_chart_${mid}">${chartHtml}</div>` : ''}
  </div>`;
}

function buildTable(columns, rows) {
  const headers = columns.map(c => `<th>${escHtml(c)}</th>`).join('');
  const bodyRows = rows.map(r =>
    `<tr>${columns.map(c => {
      const v = r[c];
      const isNum = typeof v === 'number';
      return `<td class="${isNum?'num':''}">${escHtml(String(v ?? ''))}</td>`;
    }).join('')}</tr>`
  ).join('');
  return `<div class="result-table-wrap">
    <table class="result-table"><thead><tr>${headers}</tr></thead><tbody>${bodyRows}</tbody></table>
  </div>
  <div class="result-count">${rows.length} rad${rows.length !== 1 ? 'er' : ''} returnert</div>`;
}

function buildTextView(columns, rows) {
  let html = '';
  rows.forEach((r, i) => {
    html += `<p><strong>${i+1}.</strong> ` + columns.map(c => `<strong>${c}:</strong> ${escHtml(String(r[c] ?? ''))}`).join(' · ') + '</p>';
  });
  return `<div class="text-result" style="max-height:280px;overflow-y:auto">${html}</div>`;
}

function initChart(mid, columns, rows) {
  const canvas = document.getElementById('chart_' + mid);
  if (!canvas) return;
  const numCols = columns.filter(c => typeof rows[0][c] === 'number');
  const labelCol = columns.find(c => typeof rows[0][c] !== 'number') || columns[0];
  const labels = rows.map(r => String(r[labelCol]).substring(0,16));
  const PALETTE = ['#5b7fff','#3ecf8e','#f0a22a','#f06060','#a78bfa','#67e8f9'];
  const datasets = numCols.map((col, i) => ({
    label: col,
    data: rows.map(r => r[col]),
    backgroundColor: PALETTE[i % PALETTE.length] + '99',
    borderColor: PALETTE[i % PALETTE.length],
    borderWidth: 2,
    borderRadius: 4,
    tension: 0.35
  }));
  if (chartInstances[mid]) chartInstances[mid].destroy();
  chartInstances[mid] = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#9a9ba3', font: { family: "'IBM Plex Sans'", size: 12 } } } },
      scales: {
        x: { ticks: { color: '#9a9ba3', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#9a9ba3', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
  canvas._chartMid = mid;
  canvas._chartData = { columns, rows, labelCol, numCols, labels, datasets };
}

function setChartType(mid, type, btn) {
  document.querySelectorAll(`#chart-ctrl-${mid} .chart-control-btn`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const c = chartInstances[mid];
  if (!c) return;
  const canvas = document.getElementById('chart_' + mid);
  const d = canvas._chartData;
  if (chartInstances[mid]) chartInstances[mid].destroy();
  const PALETTE = ['#5b7fff','#3ecf8e','#f0a22a','#f06060','#a78bfa','#67e8f9'];
  let cfg;
  if (type === 'pie') {
    cfg = {
      type: 'pie',
      data: {
        labels: d.labels,
        datasets: [{ data: d.rows.map(r => r[d.numCols[0]]), backgroundColor: d.labels.map((_,i) => PALETTE[i%PALETTE.length]+'cc'), borderColor: '#161719', borderWidth: 2 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#9a9ba3', font: { size: 12 } } } } }
    };
  } else {
    cfg = {
      type,
      data: { labels: d.labels, datasets: d.datasets.map(ds => ({...ds, type: undefined})) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#9a9ba3', font: { size: 12 } } } },
        scales: {
          x: { ticks: { color: '#9a9ba3', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: '#9a9ba3', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
      }
    };
  }
  chartInstances[mid] = new Chart(canvas, cfg);
  canvas._chartData = d;
}

function switchTab(mid, panel, btn) {
  const panels = ['table','text','chart'];
  panels.forEach(p => {
    const el = document.getElementById(`panel_${p}_${mid}`);
    if (el) el.classList.remove('active');
  });
  const active = document.getElementById(`panel_${panel}_${mid}`);
  if (active) active.classList.add('active');
  const tabs = btn.closest('.result-tabs').querySelectorAll('.rtab');
  tabs.forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (panel === 'chart') setTimeout(() => { const c = chartInstances[mid]; if (c) c.resize(); }, 50);
}

// --- Feedback ---
function feedback(btn, type, mid) {
  const row = btn.closest('.feedback-row');
  row.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const fbc = document.getElementById('fbc_' + mid);
  if (fbc) { fbc.classList.add('show'); }
  const msgEl = btn.closest('.msg-wrapper');
  if (msgEl) {
    const msgId = msgEl.dataset.msgId;
    if (currentSession) {
      const m = currentSession.messages.find(m => m.id == msgId);
      if (m) { m.feedback = type; saveSessions(); }
    }
  }
}

async function sendFeedback(mid) {
  const input = document.getElementById('fbinput_' + mid);
  const comment = input ? input.value.trim() : '';
  const fbc = document.getElementById('fbc_' + mid);

  const msgEl = document.querySelector(`[data-msg-id]`);
  const payload = {
    session_id: currentSession ? currentSession.id : null,
    message_id: mid,
    comment,
    ts: new Date().toISOString()
  };

  if (config.fbUrl) {
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (config.key) headers['Authorization'] = config.key.startsWith('Bearer ') ? config.key : 'Bearer ' + config.key;
      await fetch(config.fbUrl, { method: 'POST', headers, body: JSON.stringify(payload) });
    } catch (e) { console.warn('Feedback failed:', e); }
  }
  if (fbc) {
    fbc.innerHTML = '<span style="font-size:12px;color:var(--green)">✓ Tilbakemelding sendt</span>';
  }
}

// --- Config ---
function openConfig() {
  document.getElementById('cfg-url').value = config.url;
  document.getElementById('cfg-key').value = config.key;
  document.getElementById('cfg-fb').value = config.fbUrl;
  document.getElementById('cfg-env').value = config.env;
  document.getElementById('config-modal').classList.add('show');
}
function closeConfig() { document.getElementById('config-modal').classList.remove('show'); }
function saveConfig() {
  config.url = document.getElementById('cfg-url').value.trim();
  config.key = document.getElementById('cfg-key').value.trim();
  config.fbUrl = document.getElementById('cfg-fb').value.trim();
  config.env = document.getElementById('cfg-env').value;
  localStorage.setItem('qc_url', config.url);
  localStorage.setItem('qc_key', config.key);
  localStorage.setItem('qc_fb', config.fbUrl);
  localStorage.setItem('qc_env', config.env);
  updateEndpointLabel();
  closeConfig();
}

// --- Export ---
function exportHistory() {
  if (!currentSession) return;
  const lines = currentSession.messages.map(m =>
    `[${fmtTime(m.ts)}] ${m.role.toUpperCase()}: ${m.text || ''}${m.sql ? '\nSQL: '+m.sql : ''}`
  );
  const blob = new Blob([lines.join('\n\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `querychat-${currentSession.id}.txt`;
  a.click();
}

// --- Helpers ---
function scrollToBottom() {
  const el = document.getElementById('messages');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'").replace(/\n/g,'\\n');
}

function highlightSql(s) {
  const kws = ['SELECT','FROM','WHERE','ORDER','BY','GROUP','HAVING','JOIN','LEFT','RIGHT','INNER','ON','AS','AND','OR','NOT','IN','LIKE','IS','NULL','COUNT','SUM','AVG','MIN','MAX','ROUND','TRUNC','DISTINCT','LIMIT','OFFSET','FETCH','FIRST','ROWS','ONLY','INSERT','UPDATE','DELETE','CREATE','DROP','TABLE','INDEX','WITH'];
  let out = s;
  kws.forEach(k => {
    out = out.replace(new RegExp('\\b'+k+'\\b','g'), `<span class="sql-keyword">${k}</span>`);
  });
  out = out.replace(/'[^']*'/g, m => `<span class="sql-string">${m}</span>`);
  out = out.replace(/\b(\d+(\.\d+)?)\b/g, `<span class="sql-num">$1</span>`);
  return out;
}

function formatText(s) {
  return escHtml(s).replace(/\n/g,'<br>');
}

function copySql(btn, sql) {
  const decoded = sql.replace(/\\n/g,'\n').replace(/\\'/g,"'");
  navigator.clipboard.writeText(decoded).then(() => {
    btn.textContent = 'kopiert!';
    setTimeout(() => { btn.textContent = 'kopier'; }, 1500);
  });
}

// Close modal on backdrop click
document.getElementById('config-modal').addEventListener('click', function(e) {
  if (e.target === this) closeConfig();
});

// --- Start ---
init();
if (!config.url) setTimeout(openConfig, 800);
</script>
