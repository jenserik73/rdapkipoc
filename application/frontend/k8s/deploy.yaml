apiVersion: apps/v1
kind: Deployment
metadata:
  name: querychat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: querychat
  template:
    metadata:
      labels:
        app: querychat
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: querychat
        image: ocir.eu-frankfurt-2.oci.oraclecloud.eu/axpqbvkhoxdj/querychat:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: querychat
spec:
  type: LoadBalancer
  selector:
    app: querychat
  ports:
  - port: 80
    targetPort: 80
